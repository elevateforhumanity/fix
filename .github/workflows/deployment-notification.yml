name: Deployment Notifications

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    if: github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure'
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
      HEALTH_PATH: ${{ vars.DEPLOYMENT_HEALTH_PATH || '/api/health' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.deployment.sha }}
    steps:
      - name: Check deployment health
        if: env.DEPLOYMENT_STATE == 'success' && env.DEPLOYMENT_URL != ''
        id: health
        run: |
          if status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --proto '=http,https' --connect-timeout 5 --max-time 15 \
            -- "${DEPLOYMENT_URL%/}/${HEALTH_PATH#/}"); then
            case "$status" in
              200) result='Healthy (HTTP 200)' ;;
              *) result="Unhealthy (HTTP $status)" ;;
            esac
          else
            result='Unreachable'
          fi
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Create deployment summary
        env:
          HEALTH_RESULT: ${{ steps.health.outputs.result || 'Skipped' }}
        run: |
          {
            printf '# Deployment: %s\n\n' "$DEPLOYMENT_STATE"
            printf '**Environment:** %s\n**Health check:** %s\n\n' "$DEPLOYMENT_ENVIRONMENT" "$HEALTH_RESULT"
            if [ -n "$DEPLOYMENT_URL" ]; then
              printf '[View deployment](%s)\n' "$DEPLOYMENT_URL"
            fi
            printf '[View commit](%s) | [View workflow](%s)\n' "$COMMIT_URL" "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on associated PR
        if: env.DEPLOYMENT_STATE == 'success' && env.DEPLOYMENT_SHA != ''
        uses: actions/github-script@v7
        env:
          HEALTH_RESULT: ${{ steps.health.outputs.result || 'Skipped' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: process.env.DEPLOYMENT_SHA,
            });
            if (pulls.length !== 1) {
              core.info(`Skipping PR comment: found ${pulls.length} associated PRs.`);
              return;
            }
            const issue_number = pulls[0].number;
            const marker = '<!-- deployment-notification -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker));
            const body = [
              marker,
              '## Deployment Status: Success',
              `**Environment:** ${process.env.DEPLOYMENT_ENVIRONMENT}`,
              `**Health check:** ${process.env.HEALTH_RESULT}`,
              process.env.DEPLOYMENT_URL ? `[View deployment](${process.env.DEPLOYMENT_URL})` : '',
              `[View workflow](${process.env.RUN_URL})`,
            ].filter(Boolean).join('\n\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Send Slack notification
        if: ${{ !cancelled() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HEALTH_RESULT: ${{ steps.health.outputs.result || 'Skipped' }}
        run: |
          payload=$(jq -n --arg state "$DEPLOYMENT_STATE" \
            --arg environment "$DEPLOYMENT_ENVIRONMENT" --arg health "$HEALTH_RESULT" \
            --arg deployment "$DEPLOYMENT_URL" --arg run "$RUN_URL" '
              {text: ("Deployment " + $state + "\nEnvironment: " + $environment +
                "\nHealth: " + $health +
                (if $deployment == "" then "" else "\nDeployment: " + $deployment end) +
                "\nWorkflow: " + $run)}')
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null --json "$payload" -- "$SLACK_WEBHOOK_URL"
